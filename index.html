<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Factorial</title>
    <style>
        /* Estilos CSS integrados para un diseño moderno y limpio */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121824;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a2333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4f46e5;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #2e3c54;
            border-radius: 6px;
            background-color: #0f1622;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #4f46e5;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            display: none; /* Se muestra dinámicamente */
        }
        .success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }
        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Factorial Calculator</h1>
        <p style="color: #9ca3af; font-size: 14px; margin-bottom: 20px;">Ingresa un número entero no negativo:</p>
        
        <input type="text" id="numeroInput" placeholder="Ej. 5">
        <button id="calcularBtn">Calcular Factorial</button>

        <div id="resultadoBox" class="result-box"></div>
    </div>

    <!-- Enlace a tu archivo JavaScript -->
    <script src="index.js"></script>
</body>
</html>
